# Move or remove an npm dist-tag.
#
# The publish workflow derives the dist-tag from the version and the branch, so it
# never corrects a tag that landed on the wrong channel. That happens when a stable
# version publishes from a release line before `main` does, which maps it to
# `v<major>-latest`. This workflow moves or removes the tag by hand, on purpose, with
# the repo's own npm token.
#
# It refuses prerelease versions on `add`, so an -rc can never reach `latest` this way.
# Removing a tag never touches a published version; the version stays installable by
# its exact number.
name: Retag pixi-solid on NPM

on:
  workflow_dispatch:
    inputs:
      action:
        description: "add moves a tag onto a version; remove deletes the tag"
        required: true
        default: add
        type: choice
        options:
          - add
          - remove
      package:
        description: "Workspace directory name, for example pixi-solid"
        required: true
        default: pixi-solid
      version:
        description: "Exact published version. Required for add, ignored for remove"
        required: false
      tag:
        description: "Dist-tag to move or remove: latest, next, rc, or v<major>-latest"
        required: true

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          registry-url: "https://registry.npmjs.org"

      - name: Retag
        run: |
          set -euo pipefail
          action='${{ inputs.action }}'
          name=$(node -p "require('./packages/${{ inputs.package }}/package.json').name")
          version='${{ inputs.version }}'
          tag='${{ inputs.tag }}'

          case "$tag" in
            latest | next | rc | v*-latest) ;;
            *)
              echo "Refusing unknown dist-tag $tag"
              exit 1
              ;;
          esac

          case "$action" in
            remove)
              echo "$name loses the $tag tag"
              npm dist-tag rm "$name" "$tag" --registry=https://registry.npmjs.org/
              ;;
            add)
              if [[ -z "$version" ]]; then
                echo "A version is required to add a tag"
                exit 1
              fi
              if [[ "$version" == *-* ]]; then
                echo "Refusing to move a dist-tag onto prerelease $version"
                exit 1
              fi
              echo "$name@$version becomes $tag"
              npm dist-tag add "$name@$version" "$tag" --registry=https://registry.npmjs.org/
              ;;
            *)
              echo "Unknown action $action"
              exit 1
              ;;
          esac

          npm view "$name" dist-tags --json
