name: CI

on:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pixi-solid-3d is on Solid 1 and is not part of this line, so every step below
      # targets pixi-solid explicitly. pnpm test and pnpm typecheck are recursive.
      - name: Build pixi-solid
        run: pnpm --filter pixi-solid build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm --filter pixi-solid typecheck

      - name: Test
        run: pnpm --filter pixi-solid test

      # The docs import pixi-solid through its built entry.
      - name: Build docs
        run: pnpm --filter pixi-solid-docs build
