name: CI

on:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pixi-solid-3d resolves pixi-solid's built types, so it must be built first.
      - name: Build pixi-solid
        run: pnpm --filter pixi-solid build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Builds the artifact users install; tests import src, so this is separate.
      - name: Build pixi-solid-3d
        run: pnpm --filter pixi-solid-3d build
