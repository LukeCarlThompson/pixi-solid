# Publish pixi-solid to npm (pnpm). Skips publish if the package version is already published.
# The npm dist-tag is derived from the version in packages/pixi-solid/package.json:
#   - prerelease version (2.0.0-rc.1) -> next
#   - stable version on main           -> latest
#   - stable version on any other branch -> v<major>-latest (for example v1-latest)
# Triggers:
#  - push to main, release/** or v1.x (real publish)
#  - manual run (workflow_dispatch) — does a dry-run by default
name: Publish pixi-solid to NPM

on:
  push:
    branches:
      - main
      - "release/**"
      - "v1.x"
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false # Prevents auto install, we will handle it later

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm" # Caches pnpm dependencies

      - name: Install dependencies
        run: pnpm --filter "pixi-solid" install --frozen-lockfile

      - name: Test
        run: pnpm --filter "pixi-solid" test

      - name: Check if version is already published
        id: check_published
        run: node .github/scripts/check-published-version.mjs

      - name: Resolve npm dist-tag
        id: dist_tag
        if: steps.check_published.outputs.published == 'false'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/pixi-solid/package.json').version")

          if [[ "$version" == *-* ]]; then
            dist_tag=next
          elif [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            dist_tag="v${version%%.*}-latest"
          else
            dist_tag=latest
          fi

          echo "$version from ${GITHUB_REF_NAME} publishes to $dist_tag"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Verify npm auth (safe)
        if: steps.check_published.outputs.published == 'false'
        run: pnpm whoami --registry=https://registry.npmjs.org/ || true

      - name: Publish (dry-run for manual runs)
        if: github.event_name == 'workflow_dispatch' && steps.check_published.outputs.published == 'false'
        run: pnpm --filter "pixi-solid" publish --access public --dry-run --tag "${{ steps.dist_tag.outputs.dist_tag }}"

      - name: Publish
        if: github.event_name == 'push' && steps.check_published.outputs.published == 'false'
        run: pnpm --filter "pixi-solid" publish --access public --tag "${{ steps.dist_tag.outputs.dist_tag }}"
