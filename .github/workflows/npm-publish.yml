# Publish the workspace libraries to npm (pnpm). Each package is published only when its version is
# not already on the registry, so bumping one package does not republish the other.
#
# The npm dist-tag is derived from each package's own version:
#   - prerelease version (0.2.0-beta.1) -> next
#   - stable version on main            -> latest
#   - stable version on any other branch -> v<major>-latest (for example v0-latest)
#
# Triggers:
#  - push to main or a release line (real publish)
#  - manual run (workflow_dispatch) — does a dry-run by default
name: Publish to NPM

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # A branch deletion also fires a push event, and there is nothing to publish.
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    strategy:
      # One package failing should not hide the other's result.
      fail-fast: false
      matrix:
        package:
          - pixi-solid
          - pixi-solid-3d
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false # Prevents auto install, we will handle it later

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm" # Caches pnpm dependencies

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if version is already published
        id: check_published
        run: node .github/scripts/check-published-version.mjs packages/${{ matrix.package }}

      # pixi-solid must be built before anything that resolves its types or runtime.
      - name: Build pixi-solid
        if: steps.check_published.outputs.published == 'false'
        run: pnpm --filter pixi-solid build

      - name: Typecheck
        if: steps.check_published.outputs.published == 'false'
        run: pnpm --filter "${{ matrix.package }}" typecheck

      - name: Test
        if: steps.check_published.outputs.published == 'false'
        run: pnpm --filter "${{ matrix.package }}" test

      # Builds the artifact that gets published, and runs again via prepublishOnly.
      - name: Build
        if: steps.check_published.outputs.published == 'false'
        run: pnpm --filter "${{ matrix.package }}" build

      - name: Resolve npm dist-tag
        id: dist_tag
        if: steps.check_published.outputs.published == 'false'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/${{ matrix.package }}/package.json').version")

          if [[ "$version" == *-* ]]; then
            dist_tag=next
          elif [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            dist_tag="v${version%%.*}-latest"
          else
            dist_tag=latest
          fi

          echo "${{ matrix.package }} $version from ${GITHUB_REF_NAME} publishes to $dist_tag"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Verify npm auth (safe)
        if: steps.check_published.outputs.published == 'false'
        run: pnpm whoami --registry=https://registry.npmjs.org/ || true

      - name: Publish (dry-run for manual runs)
        if: github.event_name == 'workflow_dispatch' && steps.check_published.outputs.published == 'false'
        run: pnpm --filter "${{ matrix.package }}" publish --access public --no-git-checks --dry-run --tag "${{ steps.dist_tag.outputs.dist_tag }}"

      - name: Publish
        if: github.event_name == 'push' && steps.check_published.outputs.published == 'false'
        run: pnpm --filter "${{ matrix.package }}" publish --access public --no-git-checks --tag "${{ steps.dist_tag.outputs.dist_tag }}"
